services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodhub
      POSTGRES_USER: foodhub
      POSTGRES_PASSWORD: foodhub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - foodhub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodhub -d foodhub"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  foodhub-postgres:
